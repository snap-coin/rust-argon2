[package]
name = "rustdom-x-argon2"
version = "2.1.0"
authors = ["Martijn Rijkeboer <mrr@sru-systems.com>", "snap-coin"]
edition = "2021"
license = "MIT/Apache-2.0"
description = "Rust implementation of the Argon2 password hashing function."
homepage = "https://github.com/snap-coin/rust-argon2"
repository = "https://github.com/snap-coin/rust-argon2"
# Original repository (forked from): "https://github.com/sru-systems/rust-argon2"
readme = "README.md"
keywords = ["argon2", "argon2d", "argon2i", "hash", "password"]

[lib]
name = "argon2"

[dependencies]
base64 = "0.21"
blake2b_simd = "1.0"
constant_time_eq = "0.3.0"
serde = { version = "1.0", optional = true, features=["derive"] }

[dev-dependencies]
hex = "0.4"
